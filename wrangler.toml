name = "allo-mcp"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = false

routes = [
  { pattern = "mcp.allo.land", custom_domain = true },
]

[observability]
enabled = true

# Usage (src/usage.js): daily counts on the shared Allo usage counter and a raw
# log in R2, both written in the background after the answer.
[[services]]
binding = "COUNT"
service = "allo-count"
entrypoint = "Counter"

[[r2_buckets]]
binding = "LOGS"
bucket_name = "allo-mcp-logs"

[vars]
USAGE = "on" # "off" stops counts and logs
